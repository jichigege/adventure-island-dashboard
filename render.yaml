services:
  - type: web
    name: adventure-island-dashboard
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn -w 1 -b 0.0.0.0:$PORT --timeout 120 server:app"
    envVars:
      - key: ADMIN_PASSWORD
        sync: false            # 不设在仓库里；未设时代码默认管理员密码 = Gs852789
      - key: SECRET_KEY
        sync: false
        generateValue: true    # 首次部署自动生成并持久化，切勿随意改（否则已发令牌全失效）
      - key: DB_PATH
        value: /app/data/accounts.db   # SQLite 落到挂载盘，重启不丢账号
      - key: DASHBOARD_PATH
        value: /app/dashboard.html
    disk:
      name: data
      mountPath: /app/data
      sizeGB: 1
