<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>访问验证 · 冒险岛水世界商店报表看板</title>
<style>
  :root{
    --bg:#0b111d; --card:#151d30; --line:#243049;
    --txt:#e4ecf7; --txt2:#b8c5dc; --mut:#7a8bae;
    --vk:#4faaff; --warn:#ff5c5c; --ok:#34d97a;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{
    height:100%;
    background:radial-gradient(1200px 600px at 50% -10%, #142036 0%, var(--bg) 60%);
    color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .center{height:100%;display:flex;align-items:center;justify-content:center;padding:20px}
  .card{
    width:100%;max-width:380px;background:var(--card);
    border:1px solid var(--line);border-radius:16px;
    padding:32px 28px;box-shadow:0 20px 60px rgba(0,0,0,.45);
  }
  .logo{width:56px;height:56px;border-radius:14px;display:block;margin:0 auto 16px;
    background:linear-gradient(135deg,#4faaff,#3080e0);display:flex;align-items:center;justify-content:center;
    font-size:26px;font-weight:700;color:#fff}
  h1{font-size:18px;text-align:center;font-weight:600;margin-bottom:4px}
  .sub{text-align:center;color:var(--mut);font-size:13px;margin-bottom:24px}
  label{display:block;font-size:12px;color:var(--txt2);margin-bottom:8px}
  input{
    width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--line);
    background:#0e1626;color:var(--txt);font-size:15px;outline:none;
  }
  input:focus{border-color:var(--vk)}
  button{
    width:100%;margin-top:16px;padding:12px;border-radius:10px;border:none;cursor:pointer;
    background:linear-gradient(135deg,#4faaff,#3080e0);color:#fff;font-size:15px;font-weight:600;
    transition:.15s;
  }
  button:hover{filter:brightness(1.08)}
  button:disabled{opacity:.5;cursor:not-allowed}
  .msg{margin-top:14px;font-size:13px;text-align:center;min-height:18px}
  .msg.err{color:var(--warn)}
  .msg.lock{color:#ffc94d}
  .msg.ok{color:var(--ok)}
  .hint{margin-top:18px;font-size:11px;color:var(--mut);text-align:center;line-height:1.6}
</style>
</head>
<body>
<div class="center">
  <div class="card">
    <div class="logo">🏝️</div>
    <h1>冒险岛水世界商店报表看板</h1>
    <div class="sub">请输入访问密码以查看数据</div>
    <label for="pw">访问密码</label>
    <input id="pw" type="password" autocomplete="current-password" placeholder="请输入密码" autofocus>
    <button id="btn" onclick="doLogin()">登 录</button>
    <div id="msg" class="msg"></div>
    <div class="hint">数据仅供内部查看，请勿外泄。<br>连续 5 次错误将临时锁定 30 秒。</div>
  </div>
</div>

<script>
// ===== 配置（如需改密码：重新计算 SHA-256(密码+盐) 替换下方哈希即可）=====
const SALT = "adventure-island-dashboard-2026";
const VALID_HASHES = [
  "3c674223434a6915f1c217b782fc0d22293e95ca14fd8b02bbf38096f08f146f", // 主密码 Gs852789
  "6c6a6480eb905e111374863e297f6b9b15816ed1f2f296ceaa803d9366884f82"  // 分享密码 15051505
];
const MAX_FAIL = 5, LOCK_SEC = 30;
const LS_FAIL = "dash_fail", LS_LOCK = "dash_lock", LS_AUTH = "dash_auth";

function now(){ return Date.now(); }
function getFail(){ try{ return parseInt(localStorage.getItem(LS_FAIL)||"0",10);}catch(e){return 0;} }
function setFail(n){ try{ localStorage.setItem(LS_FAIL, String(n)); }catch(e){} }
function getLock(){ try{ return parseInt(localStorage.getItem(LS_LOCK)||"0",10);}catch(e){return 0;} }
function setLock(t){ try{ localStorage.setItem(LS_LOCK, String(t)); }catch(e){} }

async function sha256hex(str){
  const enc = new TextEncoder().encode(str);
  const buf = await crypto.subtle.digest("SHA-256", enc);
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");
}

function showMsg(text, cls){
  const el = document.getElementById("msg");
  el.textContent = text; el.className = "msg" + (cls?(" "+cls):"");
}

async function doLogin(){
  const btn = document.getElementById("btn");
  const pwEl = document.getElementById("pw");
  const pw = pwEl.value;

  // 锁定检查
  const lockUntil = getLock();
  if(lockUntil && now() < lockUntil){
    const left = Math.ceil((lockUntil - now())/1000);
    showMsg("已锁定，请 " + left + " 秒后重试", "lock");
    return;
  }

  if(!pw){ showMsg("请输入密码", "err"); return; }

  btn.disabled = true;
  const hash = await sha256hex(pw + SALT);

  if(VALID_HASHES.includes(hash)){
    try{ localStorage.setItem(LS_AUTH, hash); }catch(e){}
    setFail(0); setLock(0);
    showMsg("验证成功，正在进入…", "ok");
    setTimeout(function(){ location.href = "dashboard.html"; }, 400);
  } else {
    let f = getFail() + 1;
    setFail(f);
    if(f >= MAX_FAIL){
      setLock(now() + LOCK_SEC*1000);
      showMsg("错误次数过多，已锁定 30 秒", "lock");
    } else {
      showMsg("密码错误，剩余 " + (MAX_FAIL - f) + " 次机会", "err");
    }
    pwEl.value = "";
    btn.disabled = false;
  }
}

// 回车登录
document.getElementById("pw").addEventListener("keydown", function(e){
  if(e.key === "Enter"){ doLogin(); }
});

// 页面加载时若已锁定，显示倒计时
(function(){
  const lockUntil = getLock();
  if(lockUntil && now() < lockUntil){
    const left = Math.ceil((lockUntil - now())/1000);
    showMsg("已锁定，请 " + left + " 秒后重试", "lock");
    document.getElementById("btn").disabled = true;
  }
})();
</script>
</body>
</html>
